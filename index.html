<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro:bit por Voz</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078d4">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; transition: background 0.2s; }
        .connect-btn { background-color: #0078d4; color: white; }
        .connect-btn:hover { background-color: #005a9e; }
        .listen-btn { background-color: #28a745; color: white; }
        .listen-btn:hover { background-color: #218838; }
        button:disabled { background-color: #cccccc !important; color: #666666; cursor: not-allowed; }
        #status { font-weight: bold; color: #666; margin-top: 20px; font-size: 16px; }
        #transcript { font-style: italic; color: #0056b3; font-size: 22px; margin-top: 15px; min-height: 30px; }
        .commands { margin-top: 40px; font-size: 15px; color: #555; background: #eef2f7; padding: 15px; border-radius: 5px; }
        .tag { display: inline-block; background: #9c27b0; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; margin-left: 5px; }
    </style>
<base target="_blank">
</head>
<body>

    <div class="container">
        <h1>micro:bit por Voz <span class="tag">Bluetooth Inalámbrico</span></h1>
        <p>Habla a tu teléfono Android para controlar una micro:bit con pila de forma inalámbrica.</p>

        <button id="connectBtn" class="connect-btn">1. Emparejar micro:bit por Bluetooth</button>
        <button id="listenBtn" class="listen-btn" disabled>2. Empezar a Escuchar</button>

        <div id="status">Estado: Desconectado (Bluetooth apagado)</div>
        <div id="transcript">El texto hablado aparecerá aquí...</div>

        <div class="commands">
            <strong>Comandos de voz disponibles:</strong><br><br>
            <code>"Feliz"</code> | <code>"Triste"</code> | <code>"Sí"</code> | <code>"No"</code> | <code>"Borrar"</code>
        </div>
    </div>

    <script>
        // UUIDs del servicio UART nórdico usados por la extensión Bluetooth de micro:bit
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // El teléfono escribe aquí

        let bluetoothDevice;
        let txCharacteristic;
        const textEncoder = new TextEncoder();

        const connectBtn = document.getElementById('connectBtn');
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');

        // Convierte "Sí" -> "si", "Felíz" -> "feliz", etc. para que las comparaciones funcionen siempre
        function normalizar(texto) {
            return texto.toLowerCase().trim()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        // --- 1. Lógica de conexión Web Bluetooth ---
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Estado: Buscando la micro:bit...";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                statusDiv.innerText = "Estado: Conectando al servidor GATT...";
                const server = await bluetoothDevice.gatt.connect();

                statusDiv.innerText = "Estado: Localizando servicio UART...";
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                statusDiv.innerText = "Estado: ¡Conectado! Listo para usar.";
                statusDiv.style.color = "#28a745";
                listenBtn.disabled = false;
                connectBtn.disabled = true;

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    statusDiv.innerText = "Estado: Desconectado (fuera de alcance).";
                    statusDiv.style.color = "#dc3545";
                    listenBtn.disabled = true;
                    connectBtn.disabled = false;
                });

            } catch (err) {
                console.error("Falló la configuración de Bluetooth:", err);
                statusDiv.innerText = `Estado: Falló (${err.message || err})`;
                statusDiv.style.color = "#dc3545";
            }
        });

        // --- 2. Lógica del API de Voz (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Tu navegador móvil no soporta el API de Voz. Usa Google Chrome en Android.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'es-ES';

            listenBtn.addEventListener('click', () => {
                recognition.start();
                statusDiv.innerText = "Estado: Escuchando por el micrófono...";
                listenBtn.innerText = "Escuchando...";
                listenBtn.disabled = true;
            });

            recognition.onresult = async (event) => {
                const comando = normalizar(event.results[0][0].transcript);
                transcriptDiv.innerText = `Dijiste: "${comando}"`;

                if (txCharacteristic) {
                    try {
                        // MakeCode necesita el '\n' (salto de línea) como delimitador
                        let byteData = textEncoder.encode(comando + '\n');
                        await txCharacteristic.writeValue(byteData);
                    } catch (writeError) {
                        console.error("Error al escribir por Bluetooth:", writeError);
                    }
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
                resetListenButton();
            };

            recognition.onerror = (event) => {
                console.error("Error de voz:", event.error);
                resetListenButton();
            };

            function resetListenButton() {
                listenBtn.disabled = false;
                listenBtn.innerText = "2. Empezar a Escuchar";
                if (txCharacteristic) {
                    statusDiv.innerText = "Estado: ¡Conectado! Listo para usar.";
                }
            }
        }

        // --- 3. Service Worker PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('¡PWA registrado con éxito!'))
                    .catch(err => console.error('Fallo del PWA:', err));
            });
        }
    </script>
</body>
</html>
