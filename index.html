<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireless Voice micro:bit</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078d4">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; transition: background 0.2s; }
        .connect-btn { background-color: #0078d4; color: white; }
        .connect-btn:hover { background-color: #005a9e; }
        .listen-btn { background-color: #28a745; color: white; }
        .listen-btn:hover { background-color: #218838; }
        button:disabled { background-color: #cccccc !important; color: #666666; cursor: not-allowed; }
        #status { font-weight: bold; color: #666; margin-top: 20px; font-size: 16px; }
        #transcript { font-style: italic; color: #0056b3; font-size: 22px; margin-top: 15px; min-height: 30px; }
        .commands { margin-top: 40px; font-size: 15px; color: #555; background: #eef2f7; padding: 15px; border-radius: 5px; }
        .tag { display: inline-block; background: #9c27b0; color: white; padding: 2px 8px; border-radius: 3px; font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voice micro:bit <span class="tag">Bluetooth Wireless</span></h1>
        <p>Talk into your Android phone to wirelessly control a micro:bit powered by a battery pack.</p>

        <button id="connectBtn" class="connect-btn">1. Pair Bluetooth micro:bit</button>
        <button id="listenBtn" class="listen-btn" disabled>2. Start Listening</button>

        <div id="status">Status: Disconnected (Bluetooth Off)</div>
        <div id="transcript">Spoken text will appear here...</div>

        <div class="commands">
            <strong>Voice commands you can try:</strong><br><br>
            <code>"Happy"</code> | <code>"Sad"</code> | <code>"Yes"</code> | <code>"No"</code> | <code>"Clear"</code>
        </div>
    </div>

    <script>
        // Standard Nordic UART Service UUIDs used by the micro:bit Bluetooth extension
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // Phone sends to this

        let bluetoothDevice;
        let txCharacteristic;
        const textEncoder = new TextEncoder();

        const connectBtn = document.getElementById('connectBtn');
        const listenBtn = document.getElementById('listenBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');

        // --- 1. Web Bluetooth Connection Logic ---
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.innerText = "Status: Searching for micro:bit...";
                
                // Request access to the micro:bit Bluetooth device
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                statusDiv.innerText = "Status: Connecting to wireless GATT Server...";
                const server = await bluetoothDevice.gatt.connect();
                
                statusDiv.innerText = "Status: Locating UART pipeline...";
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                statusDiv.innerText = "Status: Connected Wirelessly! Ready.";
                statusDiv.style.color = "#28a745";
                listenBtn.disabled = false;
                connectBtn.disabled = true;

                // Watch for unexpected disconnects
                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    statusDiv.innerText = "Status: Disconnected out of range.";
                    statusDiv.style.color = "#dc3545";
                    listenBtn.disabled = true;
                    connectBtn.disabled = false;
                });

            } catch (err) {
                console.error("Bluetooth connection setup failed:", err);
                statusDiv.innerText = `Status: Failed (${err.message || err})`;
                statusDiv.style.color = "#dc3545";
            }
        });

        // --- 2. Web Speech API Logic ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            alert("Your mobile browser does not support the Web Speech API. Use Google Chrome on Android.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            listenBtn.addEventListener('click', () => {
                recognition.start();
                statusDiv.innerText = "Status: Listening through phone microphone...";
                listenBtn.innerText = "Listening...";
                listenBtn.disabled = true;
            });

            recognition.onresult = async (event) => {
                const command = event.results[0][0].transcript.toLowerCase().trim();
                transcriptDiv.innerText = `You said: "${command}"`;

                // If Bluetooth pipe is healthy, push encoded bytes into the micro:bit character queue
                if (txCharacteristic) {
                    try {
                        // MakeCode expects a '\n' (newline) string termination to trigger serial delimiters
                        let byteData = textEncoder.encode(command + '\n');
                        await txCharacteristic.writeValue(byteData);
                    } catch (writeError) {
                        console.error("Error writing data over Bluetooth:", writeError);
                    }
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
                resetListenButton();
            };

            recognition.onerror = (event) => {
                console.error("Speech error:", event.error);
                resetListenButton();
            };

            function resetListenButton() {
                listenBtn.disabled = false;
                listenBtn.innerText = "2. Start Listening";
                if (txCharacteristic) {
                    statusDiv.innerText = "Status: Connected Wirelessly! Ready.";
                }
            }
        }

        // --- 3. PWA Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Registered successfully!'))
                    .catch(err => console.error('PWA Fail:', err));
            });
        }
    </script>
</body>
</html>
